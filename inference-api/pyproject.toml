[project]
name = "inference-api"
version = "0.1.0"
description = "PU'ER inference API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "environs",
    "fastapi",
    "loguru",
    "numpy",
    "openai",
    "pandas",
    "protobuf",
    "pydantic>=2",
    "python-multipart",
    "requests",
    "sentence-transformers",
    "sentencepiece",
    "transformers",
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "ruff",
    "ty",
]

[tool.uv]
package = false
exclude-dependencies = ["torch"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ty.src]
include = ["app", "tests"]
